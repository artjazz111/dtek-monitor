name: Run power outages monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [power-outage-detected]

concurrency:
  group: dtek-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          
      - name: Runner sanity check
        run: |
          echo "Runner works"
          uname -a
          date
          pwd
          ls -la
      

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Run monitoring script
        env:
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          GROUP: ${{ vars.GROUP }}
        run: node ./src/monitor.js

      # Payload і так лежить у логах запуску (DEBUG payload), тому вантажимо
      # артефакти лише коли скрипт упав — заради last_error.txt і скриншота
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-debug-${{ github.run_id }}
          path: |
            artifacts/last_error.txt
            artifacts/last_payload.json
            artifacts/page.png
          retention-days: 7
          if-no-files-found: ignore

      # Комітимо тільки стан повідомлення Telegram: контейнер щоразу новий,
      # тому без цього наступний запуск не знав би, що повідомлення вже є,
      # і надсилав би нове замість редагування. Поза відключеннями файлу
      # немає — отже й комітів немає.
      - name: Commit Telegram message state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add artifacts/

          if ! git diff --cached --quiet; then
            LAST_COMMIT_MSG=$(git log -1 --pretty=%B || echo "")
            if [ "$LAST_COMMIT_MSG" = "chore: update message state" ]; then
              git commit --amend --no-edit
            else
              git commit -m "chore: update message state"
            fi
            git push origin main --force-with-lease
          else
            echo "No changes to commit"
          fi
